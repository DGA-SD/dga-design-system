<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"light";</script>
<meta charset="utf-8">
<title>DGA</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--orange); }
  .deep { fill:var(--chart-1); }
  .tint { fill:var(--chart-3); }
  .slab { rx:var(--radius-lg); }
  .blk { rx:var(--radius-md); }
  .trace { fill:var(--orange); rx:2px; }
  .node { fill:var(--orange); }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      orange 200x236 slab bled off the top (the logo's "DG", largest) · chart-1 (navy; lavender in dark) 228x256 bled off right and bottom (the logo's "A") · chart-3 104x80 tint bled off the bottom — about 35% of 960x288
  arrangement one tall orange slab with a navy block stepped down to its right, a small tint between them at the foot, gutters space-4
  pattern     circuit traces, the literal motif of the logo (the wires ending in dots on the "D"): 4px traces ending in discs at a space-8 pitch, three leaving the slab to the left, two cut across the navy block
  scales      gutters space-4; pitch space-8; slab radius-lg, blocks radius-md, nodes radius-round, traces 4px
-->
<rect class="brand slab" x="56" y="-20" width="200" height="236" rx="20"/>
<rect class="deep slab" x="272" y="56" width="228" height="256" rx="20"/>
<rect class="tint blk" x="152" y="232" width="104" height="80" rx="12"/>
<rect class="trace" x="16" y="118" width="48" height="4"/>
<rect class="trace" x="32" y="150" width="32" height="4"/>
<rect class="trace" x="16" y="182" width="48" height="4"/>
<circle class="node" cx="16" cy="120" r="7"/>
<circle class="node" cx="32" cy="152" r="7"/>
<circle class="node" cx="16" cy="184" r="7"/>
<rect class="trace" x="272" y="118" width="120" height="4"/>
<rect class="trace" x="272" y="150" width="88" height="4"/>
<circle class="node" cx="392" cy="120" r="7"/>
<circle class="node" cx="360" cy="152" r="7"/>
</svg>
</div>
<div class="words">
<h1 class="name">DGA</h1>
<p class="tag">สำนักงานพัฒนารัฐบาลดิจิทัล · Digital Government in Action</p>
</div>
</div>
</body>
</html>
